[project]
name = "apparatica-judge"
version = "0.1.0"
description = "Apparatica judge: problem packages, judging pipeline and CLI"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.poetry]
packages = [{ include = "judge", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
