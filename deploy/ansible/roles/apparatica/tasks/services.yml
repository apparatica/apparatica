# The services of the release: its images pulled or built on the host, the long-running services
# waited for as `just up` does, the demo problems imported, monitoring, the checks; then the current
# link.

# A release from before the published images has no file: its images are built on the host.
- name: Keep the images of a release without them empty
  ansible.builtin.copy:
    dest: "{{ apparatica_root }}/releases/{{ apparatica_release }}/release.env"
    content: ""
    force: false
    mode: "0644"

- name: Read the images of the release
  ansible.builtin.slurp:
    src: "{{ apparatica_root }}/releases/{{ apparatica_release }}/release.env"
  register: apparatica_release_env

- name: List the images of the release
  ansible.builtin.set_fact:
    apparatica_images: >-
      {{ (apparatica_release_env.content | b64decode).splitlines()
         | select('match', '^(API|WORKER|WEB)_IMAGE=') | map('regex_replace', '^[^=]+=', '') | list }}
    apparatica_postgres_images: >-
      {{ (apparatica_release_env.content | b64decode).splitlines()
         | select('match', '^POSTGRES_IMAGE=') | map('regex_replace', '^[^=]+=', '') | list }}

# A tag names one commit: an image already on the host is that one.
- name: Pull the published images
  ansible.builtin.shell: docker image inspect {{ item }} > /dev/null 2>&1 || docker pull --quiet {{ item }}
  loop: "{{ apparatica_images }}"
  register: apparatica_pull
  changed_when: apparatica_pull.stdout != ""

# Named by the files it is built from: an image already on the host is that one.
- name: Build the Postgres image of the release
  ansible.builtin.shell: >-
    docker image inspect {{ item }} > /dev/null 2>&1 ||
    { {{ apparatica_compose }} build --quiet postgres && echo built; }
  args:
    chdir: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
  loop: "{{ apparatica_postgres_images }}"
  register: apparatica_postgres_build
  changed_when: "'built' in apparatica_postgres_build.stdout"

# Published images are never built here: a missing one fails the deploy instead.
- name: Start the services of the release
  ansible.builtin.command: >-
    {{ apparatica_compose }} up -d {{ '--no-build' if apparatica_images else '--build' }}
    --wait --wait-timeout 900 caddy valkey-queue valkey-cache ingest worker
  args:
    chdir: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
  changed_when: true

- name: Import the problems of the release
  ansible.builtin.command: "{{ apparatica_compose }} run --rm demo-problems"
  args:
    chdir: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
  register: apparatica_import
  changed_when: "'новых версий: 0,' not in apparatica_import.stdout"

- name: Start the monitoring
  when: apparatica_monitoring
  ansible.builtin.command: >-
    {{ apparatica_compose }} --profile monitoring up -d prometheus alertmanager node-exporter grafana
  args:
    chdir: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
  changed_when: true

- name: Mark the time the release was deployed
  ansible.builtin.file:
    path: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
    state: touch
    mode: "0755"

- name: Point the current link to the release
  ansible.builtin.file:
    src: "{{ apparatica_root }}/releases/{{ apparatica_release }}"
    dest: "{{ apparatica_root }}/current"
    state: link

- name: Check the storage and the judging through the public names
  when: apparatica_checks
  ansible.builtin.command: "{{ apparatica_compose }} run --rm {{ item }}"
  args:
    chdir: "{{ apparatica_root }}/current"
  loop: [storage-check, judge-check]
  changed_when: false

- name: Find the old releases
  ansible.builtin.find:
    paths: "{{ apparatica_root }}/releases"
    file_type: directory
  register: apparatica_releases

# The newest by the time they were last deployed (the current link), the current one never.
- name: Remove the releases beyond the kept ones
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: >-
    {{ (apparatica_releases.files
        | rejectattr('path', 'equalto', apparatica_root ~ '/releases/' ~ apparatica_release)
        | sort(attribute='mtime', reverse=true))[apparatica_keep_releases - 1:] }}
  loop_control:
    label: "{{ item.path | basename }}"

# Images of the releases that are gone, and dangling ones of the builds on the host.
- name: Remove the images no kept release uses
  ansible.builtin.shell: |
    set -euo pipefail
    kept=$(cat {{ apparatica_root }}/releases/*/release.env | sed -n 's/^[A-Z_]*_IMAGE=//p' | sort -u)
    for image in $(docker images --format '{{ '{{.Repository}}:{{.Tag}}' }}' | grep -E '^({{ apparatica_registry }}/(api|worker|web)|apparatica-postgres):'); do
      echo "$kept" | grep -qxF "$image" || docker rmi "$image"
    done
    docker image prune -f
  args:
    executable: /bin/bash
  register: apparatica_prune
  changed_when: "'Untagged' in apparatica_prune.stdout or 'Total reclaimed space: 0B' not in apparatica_prune.stdout"
