# Where the releases and the settings live on the host (docs/deployment.md#на-сервере).
apparatica_root: /opt/apparatica
apparatica_config: /etc/apparatica
# Releases kept for a rollback, the current one included.
apparatica_keep_releases: 5
# The repository on the control node: its commit is the release.
apparatica_repo: "{{ playbook_dir }}/../.."
# The checks of `just stand-check` against the public names after a deploy.
apparatica_checks: true
# Prometheus, Alertmanager, node-exporter and Grafana (docs/deployment.md#мониторинг).
apparatica_monitoring: false
# Alerts (docs/alerts.md): Alertmanager sends them to this Telegram chat with the bot whose token,
# TELEGRAM_BOT_TOKEN, goes to secrets.env by hand (BotFather issues it). Empty: no messages, the
# alerts are seen in Grafana only.
apparatica_alert_telegram_chat_id: ""
# The metrics the backup units write for the alerts; node-exporter reads them from there
# (compose.server.yaml).
apparatica_metrics_dir: /var/lib/apparatica/metrics
# Backups of Postgres with WAL-G (docs/backups.md): the archive of WAL, a full backup daily at
# apparatica_backup_time, the restore check weekly at apparatica_backup_check_time (systemd calendar
# events, UTC). The bucket of another provider; its keys BACKUP_S3_KEY_ID and BACKUP_S3_KEY_SECRET
# go to secrets.env by hand. Off: no archive of WAL either, but the storage stays configured for a
# restore (deploy/RUNBOOK.md#восстановление-базы).
apparatica_backups: false
apparatica_backup_s3_url: ""
apparatica_backup_s3_region: ""
apparatica_backup_s3_bucket: ""
apparatica_backup_time: "*-*-* 03:00:00 UTC"
apparatica_backup_check_time: "Sun *-*-* 04:00:00 UTC"
apparatica_garage_capacity_gb: 10
# The published images of the release, ghcr.io/apparatica/<name>:<tag>: CI passes the tag of its
# commit (sha-<12 digits>). Without it the images are built on the host from the files of the release.
apparatica_registry: ghcr.io/apparatica
apparatica_image_tag: ""
# The images a release runs are written next to it (release.env), so a rollback takes them back too.
apparatica_compose: >-
  docker compose -f deploy/compose.yaml -f deploy/compose.server.yaml
  --env-file {{ apparatica_config }}/settings.env --env-file {{ apparatica_config }}/secrets.env
  --env-file {{ apparatica_root }}/releases/{{ apparatica_release }}/release.env
