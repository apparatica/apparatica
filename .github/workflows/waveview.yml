name: Waveview site

on:
  push:
    branches: [master]
    paths:
      - waveview/**
      # The regression test opens the FST of this recording (current toolchain profile).
      - web/src/mocks/scenarios/wrong-answer.json
      - pnpm-lock.yaml
      - .github/workflows/waveview.yml
  pull_request:
    paths:
      - waveview/**
      - web/src/mocks/scenarios/wrong-answer.json
      - pnpm-lock.yaml
      - .github/workflows/waveview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waveview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/waveview

jobs:
  build:
    name: Build, test, publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # to diff the build inputs against the base
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read version
        id: version
        run: echo "id=$(sed -n 's/^WAVEVIEW_VERSION=//p' waveview/versions.lock)" >> "$GITHUB_OUTPUT"

      # Only changes of the build inputs make a new version; tests and docs do not.
      - name: Detect build changes
        id: build
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          inputs="waveview/Dockerfile waveview/versions.lock waveview/themes waveview/site"
          if [ "$EVENT" = workflow_dispatch ]; then
            changed=false
          elif [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            changed=true
          elif git diff --quiet "$BASE" HEAD -- $inputs; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: waveview
          load: true
          tags: apparatica-waveview:dev
          cache-from: type=gha,scope=waveview
          cache-to: type=gha,scope=waveview,mode=max

      - name: Export the files
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: waveview
          target: export
          outputs: type=local,dest=waveview/dist
          cache-from: type=gha,scope=waveview

      - name: Install the test environment
        run: pnpm install --frozen-lockfile --filter @apparatica/waveview

      # Chrome of the runner image, driven by playwright-core.
      - name: Test the build
        env:
          WAVEVIEW_BROWSER: chrome
        run: |
          pnpm -C waveview test
          pnpm -C waveview test:build

      - name: Log in to GHCR
        if: github.event_name == 'push' && steps.build.outputs.changed == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version is immutable: browsers cache it forever and profiles name it (ADR-0004).
      # Pull requests check it too, so a missing WAVEVIEW_VERSION bump fails before merge.
      - name: Check that the version is new
        if: steps.build.outputs.changed == 'true'
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.version.outputs.id }}" > /dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.id }} already exists; bump WAVEVIEW_VERSION in waveview/versions.lock"
            exit 1
          fi

      - name: Publish
        if: github.event_name == 'push' && steps.build.outputs.changed == 'true'
        run: |
          for tag in "${{ steps.version.outputs.id }}" "sha-${GITHUB_SHA::12}"; do
            docker tag apparatica-waveview:dev "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
