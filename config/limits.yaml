# Solution size, check quotas and the waveform viewer (specs/02 NFR-LIM-01/08, specs/07 §3,
# FR-WAV-02; decision ОВ-11).
# Served to the frontend by GET /api/v1/config and enforced by the API (docs/api.md).
solution:
  max_bytes: 65536
  max_lines: 2000
quotas:
  guest:
    checks_per_hour: 10
    concurrent: 1
    heavy_per_day: 0          # heavy problems are not available to guests
    waveforms_per_hour: 5
  user:
    checks_per_hour: 60
    concurrent: 2
    heavy_per_day: 20
    waveforms_per_hour: 20
# The waveform viewer of the problem page: a larger FST is offered for download only. Surfer parses
# about 5 MB in 2 s in the browser (docs/spikes/s3.md).
waveforms:
  view_max_mb: 5
