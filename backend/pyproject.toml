[project]
name = "apparatica-backend"
version = "0.1.0"
description = "Apparatica backend: FastAPI application and results ingestor"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["apparatica-judge", "fastapi (>=0.120)", "uvicorn (>=0.38)", "pydantic-settings (>=2.11)", "sqlalchemy[asyncio] (>=2.0.44)", "asyncpg (>=0.30)", "alembic (>=1.17)", "structlog (>=25.4)", "pyyaml (>=6.0.2)", "boto3 (>=1.40,<2.0)", "dramatiq[redis] (>=2.2,<3)"]

[project.scripts]
apparatica = "apparatica.cli:main"
apparatica-admin = "apparatica.admin.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
    "import-linter>=2.3",
    "types-pyyaml (>=6.0)",
    "aiosqlite (>=0.21)",
    "httpx2 (>=2.16.0,<3.0.0)",
    "testcontainers[postgres,redis] (>=4.13,<5.0)",
    "moto[s3] (>=5.1,<6.0)",
    "boto3-stubs[s3] (>=1.40,<2.0)",
]

[tool.poetry]
packages = [{ include = "apparatica", from = "src" }]

[tool.poetry.dependencies]
apparatica-judge = { path = "../judge", develop = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
strict = true
untyped_calls_exclude = ["dramatiq.brokers.redis"]  # RedisBroker has no annotations
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.importlinter]
root_packages = ["apparatica", "judge"]

[[tool.importlinter.contracts]]
name = "Backend does not depend on judge language modules (ADR-0011)"
type = "forbidden"
source_modules = ["apparatica"]
forbidden_modules = ["judge.languages"]

[[tool.importlinter.contracts]]
name = "Backend core depends on no other backend module (specs/03 §3)"
type = "forbidden"
source_modules = ["apparatica.core"]
forbidden_modules = ["apparatica.main", "apparatica.cli"]

[[tool.importlinter.contracts]]
name = "Backend modules depend on each other in one direction (specs/03 §3)"
type = "layers"
layers = [
    "apparatica.admin | apparatica.judging",
    "apparatica.submissions",
    "apparatica.captcha",
    "apparatica.problems",
    "apparatica.core",
]
