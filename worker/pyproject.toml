[project]
name = "apparatica-worker"
version = "0.1.0"
description = "Apparatica worker: Dramatiq actor and sandbox orchestrator"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["apparatica-judge", "dramatiq[redis] (>=2.2,<3)", "pydantic-settings (>=2.11,<3)", "structlog (>=25.4)", "boto3 (>=1.40,<2.0)"]

[project.scripts]
apparatica-worker = "apparatica_worker.main:main"
apx-sandboxd = "apparatica_worker.sandboxd.server:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
    "testcontainers[redis] (>=4.13,<5.0)",
    "moto[s3] (>=5.1,<6.0)",
    "boto3-stubs[s3] (>=1.40,<2.0)",
    "types-pyyaml (>=6.0)",
]

[tool.poetry]
packages = [{ include = "apparatica_worker", from = "src" }]

[tool.poetry.dependencies]
apparatica-judge = { path = "../judge", develop = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not image"]
markers = ["image: needs Docker and the toolchain image; run by `just toolchain-test`"]

[tool.mypy]
strict = true
untyped_calls_exclude = ["dramatiq.brokers.redis"]  # RedisBroker has no annotations
files = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
