# Rate limits against abuse (specs/02 NFR-SEC-06), counted in valkey-cache: moving windows over the
# requests to the mutating endpoints, the checks and logins of one client address and the captcha.
# They may lose their counters and are not shown to users; the quotas users see are in limits.yaml.
# An address is an IPv4 address or an IPv6 /64 network.
requests_per_ip:
  limit: 120
  window_s: 60
# Of a guest or a signed-in user.
requests_per_author:
  limit: 30
  window_s: 60
# Autosaves of drafts of one signed-in user (FR-EDT-02): a second after the last change, so a steady
# typist sends up to one a second. Its own window: typing spends neither the requests above nor
# those of an address a class shares.
drafts_per_user:
  limit: 120
  window_s: 60
# Checks of guests who drop their cookie; generous, since a classroom shares one address.
checks_per_ip:
  limit: 300
  window_s: 3600
# Starts of a login (a provider, a login link) and uses of login links; a whole class may sign in
# from one address at the start of a lesson.
logins_per_ip:
  limit: 100
  window_s: 600
# Login links sent to one email address, whoever asks for them: a few retries of a lost letter, not
# a flood of letters to someone else's address.
logins_per_email:
  limit: 5
  window_s: 3600
# Captcha before guest checks (FR-GST-05): once a guest or an address has sent `limit` checks in
# `window_s` seconds, the next ones need a solved ALTCHA challenge; the `captcha` feature flag
# asks for it before every guest check. A challenge is valid for `expires_s` seconds and once.
# max_number is its work: the browser tries up to that many SHA-256 hashes (~0.1 s per 100 000).
captcha:
  per_guest:
    limit: 3
    window_s: 60
  per_ip:
    limit: 10
    window_s: 60
  max_number: 100000
  expires_s: 600
