# The platform on the host (docs/deployment.md): the release of the repository, the settings and
# the secrets, the services of deploy/compose.yaml with compose.server.yaml, the checks.
- name: Keep the worker on the app host
  ansible.builtin.assert:
    that: "'worker' in group_names"
    fail_msg: >-
      A separate worker host needs the queue and the storage of the app host over a private network;
      until then both roles live on one host (docs/deployment.md#хосты).

- name: Create the directories of the platform
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ apparatica_config }}", mode: "0700" }
    - { path: "{{ apparatica_root }}/releases", mode: "0755" }
    - { path: "{{ apparatica_metrics_dir }}", mode: "0755" }

- name: Install the generator of the secrets
  ansible.builtin.copy:
    src: apparatica-secrets.py
    dest: /usr/local/sbin/apparatica-secrets
    mode: "0755"

- name: Generate the missing secrets
  ansible.builtin.command: /usr/local/sbin/apparatica-secrets {{ apparatica_config }}/secrets.env
  register: apparatica_secrets
  changed_when: apparatica_secrets.stdout != ""

- name: Read the secrets
  ansible.builtin.slurp:
    src: "{{ apparatica_config }}/secrets.env"
  register: apparatica_secrets_env

# Issued by the provider of the backup storage, not generated: without them WAL would pile up on the
# host, archived nowhere.
- name: Check the settings of the backups
  when: apparatica_backups
  ansible.builtin.assert:
    that:
      - apparatica_backup_s3_url != ""
      - apparatica_backup_s3_region != ""
      - apparatica_backup_s3_bucket != ""
      - (apparatica_secrets_env.content | b64decode) is search('(?m)^BACKUP_S3_KEY_ID=.')
      - (apparatica_secrets_env.content | b64decode) is search('(?m)^BACKUP_S3_KEY_SECRET=.')
    fail_msg: >-
      Backups need apparatica_backup_s3_url, _region, _bucket in the inventory and BACKUP_S3_KEY_ID,
      BACKUP_S3_KEY_SECRET in {{ apparatica_config }}/secrets.env (docs/backups.md).

# Issued by BotFather: a chat without the token of its bot, or a token without its chat, would stop
# Alertmanager.
- name: Check the settings of the alerts
  vars:
    apparatica_telegram_token: >-
      {{ (apparatica_secrets_env.content | b64decode) is search('(?m)^TELEGRAM_BOT_TOKEN=.') }}
  ansible.builtin.assert:
    that:
      - (apparatica_alert_telegram_chat_id | string != "") == (apparatica_telegram_token | bool)
      - apparatica_alert_telegram_chat_id | string is match('^(-?[0-9]+)?$')
    fail_msg: >-
      Alerts to Telegram need both apparatica_alert_telegram_chat_id (an integer) in the inventory
      and TELEGRAM_BOT_TOKEN in {{ apparatica_config }}/secrets.env, or neither (docs/alerts.md).

- name: Write the settings
  ansible.builtin.template:
    src: settings.env.j2
    dest: "{{ apparatica_config }}/settings.env"
    mode: "0600"

- name: Pack the release
  ansible.builtin.import_tasks: release.yml

- name: Start the services
  ansible.builtin.import_tasks: services.yml

- name: Schedule the backups
  ansible.builtin.import_tasks: backups.yml
