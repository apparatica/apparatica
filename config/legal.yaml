# The legal documents of the site (FR-AUTH-06, specs/09 §5). Their texts are
# web/content/legal/<key>.md; the site fills in the operator. Served to the frontend by
# GET /api/v1/config.
#
# The texts are drafts until a lawyer has read them and the operator is known (ОВ-18): the site
# marks them so. Before the public launch (T3.14): the operator, then `draft: false`.
draft: true
operator:
  name: "[оператор — уточняется]"
  address: "[адрес оператора — уточняется]"
  email: "[почта для запросов — уточняется]"
# What a user accepts at the first login: the first login records these versions as accepted
# (the consents of the account). A new version is the date of the edition; sha256 is that of the
# text: a test fails when the text changes without it, so that every change of a text is a
# decision on its version. A changed version is not asked again: the documents say how users learn
# of changes.
documents:
  terms:
    version: 2026-11-04
    sha256: "687c0ea72c0b77481052a8b8c1de6ff29ec998d0aaa4d06be870fa34d9d0da53"
  privacy:
    version: 2026-11-04
    sha256: "b8129e33d25e889f80a2d929a38cfcbfdf946b63f1e81ae40f82164403120548"
