target-version = "py313"
# Source roots: imports from these directories are first-party.
src = ["judge/src", "backend/src", "worker/src", "scripts", "toolchain/tests", "tests/security"]
line-length = 100
extend-exclude = ["brief", "*.md"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
]
# Messages and docs are in Russian: Cyrillic letters are text here, not homoglyphs of Latin ones.
allowed-confusables = [
    "а", "б", "в", "г", "е", "з", "к", "м", "н", "о", "п", "р", "с", "т", "у", "х", "ч", "ь",
    "А", "В", "Г", "Е", "З", "К", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Х", "Ь",
]

[lint.per-file-ignores]
# Tables of solutions under test: one case per line reads better than wrapped code.
"judge/tests/test_precheck_*.py" = ["E501"]
