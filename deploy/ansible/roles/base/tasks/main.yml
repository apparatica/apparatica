# The host itself: packages, SSH by keys only, the firewall, security updates, the journal.
- name: Install the packages of the host
  ansible.builtin.apt:
    # python3-debian: deb822_repository of the roles gvisor and docker; not every image has it.
    name:
      [ca-certificates, curl, gnupg, nftables, unattended-upgrades, apt-listchanges, sudo, python3-debian]
    update_cache: true
    cache_valid_time: 3600

- name: Create the directories of drop-in configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/systemd/system/nftables.service.d, /etc/systemd/journald.conf.d]

- name: Allow SSH by keys only
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-apparatica.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# Ansible runs as it with sudo, as an operator does as root: the deploy of a commit of master runs
# that code on the host anyway (sandboxd holds the Docker socket), so the user is no smaller power.
- name: Create the user of the deploys
  ansible.builtin.user:
    name: "{{ base_deploy_user }}"
    shell: /bin/bash
    password: "!"
    update_password: on_create

- name: Create the SSH directory of the user of the deploys
  ansible.builtin.file:
    path: /home/{{ base_deploy_user }}/.ssh
    state: directory
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: "0700"

- name: Authorize the keys of the deploys
  ansible.builtin.copy:
    dest: /home/{{ base_deploy_user }}/.ssh/authorized_keys
    # The comment keeps the file valid without keys: no CI deploys to this host yet.
    content: |
      # base_deploy_keys of the inventory (deploy/ansible)
      {% for key in base_deploy_keys %}
      {{ key }}
      {% endfor %}
    owner: "{{ base_deploy_user }}"
    group: "{{ base_deploy_user }}"
    mode: "0600"

- name: Let the user of the deploys use sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/apparatica-deploy
    content: |
      {{ base_deploy_user }} ALL=(ALL) NOPASSWD: ALL
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Write the firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the firewall

# The service flushes the whole ruleset on stop, the tables of Docker included: only ours.
- name: Stop the firewall without the rules of Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/apparatica.conf
    mode: "0644"
    content: |
      [Service]
      ExecStop=
      ExecStop=/usr/sbin/nft delete table inet apparatica
  notify: Reload the firewall

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true

# Debian's own origins only (50unattended-upgrades): Docker and gVisor change with the playbooks;
# no reboots.
- name: Install the updates of Debian daily
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Limit the journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/apparatica.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ base_journal_max }}
  notify: Restart journald
