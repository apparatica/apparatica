# The public names of staging; their DNS A and AAAA records point to the app host. The root domain
# is production's.
apparatica_site_host: staging.apparatica.app
apparatica_s3_host: s3.staging.apparatica.app
apparatica_waveview_host: waveview.staging.apparatica.app

# Size of the Garage node, GB.
apparatica_garage_capacity_gb: 50
# Backups of Postgres (docs/backups.md): Cloudflare R2, a bucket under the EU jurisdiction. Its keys,
# BACKUP_S3_KEY_ID and BACKUP_S3_KEY_SECRET, are in /etc/apparatica/secrets.env.
apparatica_backups: true
apparatica_backup_s3_url: https://06127661db7bdce1f8d118d524def246.eu.r2.cloudflarestorage.com
apparatica_backup_s3_region: auto
apparatica_backup_s3_bucket: apparatica-staging-backups

# Login letters go through Brevo (docs/deployment.md#почта) from the root domain, which Brevo
# authenticates (SPF, DKIM, DMARC); the SMTP URL, APX_SMTP_URL, is in /etc/apparatica/secrets.env.
apparatica_mail_from: "Apparatica <noreply@apparatica.app>"

# Prometheus, Alertmanager and Grafana (Grafana on 127.0.0.1:3000 of the server, through an SSH
# tunnel).
apparatica_monitoring: true
# Alerts (docs/alerts.md): a private chat with the bot @apparatica_status_bot, whose token,
# TELEGRAM_BOT_TOKEN, is in /etc/apparatica/secrets.env.
apparatica_alert_telegram_chat_id: 1278330698

# The key of CI (GitHub environment `staging`, secret STAGING_SSH_KEY), for the user deploy.
base_deploy_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKBVNhycB8hCylkz7y4RkPBq48ZJxg9Tpx5+9IzD9PEK apparatica-ci-staging
