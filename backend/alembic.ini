# For alembic commands during development (`poetry -C backend run alembic revision ...`).
# The database URL comes from APX_DATABASE_URL (apparatica.core.settings); `apparatica migrate`
# needs no ini file.
[alembic]
script_location = apparatica:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
