name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POETRY_VERSION: "2.3.2"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.13"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            judge/.venv
            backend/.venv
            worker/.venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('*/poetry.lock') }}
      - run: just install-py
      - run: just check-locks
      - run: just lint-py
      - run: just lint-imports
      - run: just typecheck-py
      - run: just test-py
      - run: just check-licenses-py

  js:
    name: JS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just install-js
      - run: just lint-js
      - run: just typecheck-js
      - run: just check-api
      - run: just test-js
      - run: just build-js
      - run: just build-storybook
      - run: just check-licenses-js

  stand:
    name: Stand
    runs-on: ubuntu-24.04
    # NFR-MAINT-06: the stand comes up in 15 minutes on a clean machine with published images; a new
    # waveview version is built here first.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # The waveview image of the stand is published when its workflow runs on master; until then
      # (a pull request with a new WAVEVIEW_VERSION) the stand takes a build of this commit.
      - name: Look up the waveview image
        id: waveview
        run: |
          version=$(sed -n 's/^WAVEVIEW_VERSION=//p' waveview/versions.lock)
          if docker manifest inspect "ghcr.io/apparatica/waveview:$version" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "WAVEVIEW_IMAGE=apparatica-waveview:dev" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.waveview.outputs.published == 'false'
      - name: Build the waveview image
        if: steps.waveview.outputs.published == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: waveview
          load: true
          tags: apparatica-waveview:dev
          cache-from: type=gha,scope=waveview
      # The sandboxes of the stand run under gVisor, as on staging (ADR-0003). The apt repository of
      # gVisor serves its latest release only.
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor.gpg] https://storage.googleapis.com/gvisor/releases release main"             | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          echo "SANDBOX_RUNTIME=runsc" >> "$GITHUB_ENV"
      - name: Start the stand
        run: just up
      - name: Check the object storage and the judging of submissions
        run: just stand-check
      - name: Smoke-test the site and the API through Caddy
        run: |
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/api/v1/problems | grep -q '"slug":"mux4"'
          curl -fsS http://localhost:8080/problems | grep -q '<title>'
      - name: Logs of the stand
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml logs
