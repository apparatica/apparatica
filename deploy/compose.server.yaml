# The platform on a server (staging, production; docs/deployment.md): deploy/compose.yaml with this
# file on top. Caddy serves the public names over HTTPS, the API runs in production mode, nothing
# else is published. Installed and started by Ansible (deploy/ansible), which writes the settings
# and the generated secrets to /etc/apparatica:
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.server.yaml \
#     --env-file /etc/apparatica/settings.env --env-file /etc/apparatica/secrets.env up -d
#
# Settings: SITE_HOST, S3_HOST, WAVEVIEW_HOST (public names), SANDBOX_RUNTIME=runsc,
# APX_ENVIRONMENT=production, APX_COOKIE_SECURE=true; POSTGRES_ARCHIVE_MODE and, with backups on,
# BACKUP_S3_URL, BACKUP_S3_REGION, BACKUP_S3_BUCKET; TELEGRAM_CHAT_ID of the alerts. Every secret of
# compose.yaml comes from secrets.env: its public development defaults are never used (Ansible
# checks it).

services:
  # Backups go to the storage of another provider (BACKUP_S3_* of settings.env and secrets.env,
  # docs/backups.md), not to the Garage of the same host: it holds no key for them.
  garage-setup:
    environment:
      CORS_ORIGINS: https://${SITE_HOST:?}
      KEY_BACKUP_ID: ""
      KEY_BACKUP_SECRET: ""

  api:
    environment:
      APX_S3_PUBLIC_URL: https://${S3_HOST:?}
      APX_WAVEVIEW_URL: https://${WAVEVIEW_HOST:?}
      APX_PUBLIC_BASE_URL: https://${SITE_HOST:?}

  web:
    environment:
      S3_PUBLIC_URL: https://${S3_HOST:?}
      WAVEVIEW_URL: https://${WAVEVIEW_HOST:?}

  caddy:
    environment: !override
      SITE_HOST: ${SITE_HOST:?}
      S3_HOST: ${S3_HOST:?}
      WAVEVIEW_HOST: ${WAVEVIEW_HOST:?}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  prometheus:
    environment:
      ALERT_SITE: ${SITE_HOST:?}

  # The root of the host, read-only: its filesystems and the metrics of the backups, which the
  # backup units write to /var/lib/apparatica/metrics (apparatica_metrics_dir of Ansible,
  # docs/alerts.md).
  node-exporter:
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/var/lib/apparatica/metrics
    pid: host
    volumes:
      - /:/host:ro,rslave

  # Grafana is not public: an SSH tunnel to the port on the loopback of the server.
  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"

  # The checks of `just stand-check` through Caddy under the public names, with their certificates
  # (Ansible runs them after a deploy). The names lead to this host itself: the checks test the
  # deployment, not the caches of public resolvers, and the network of the containers has no IPv6.
  storage-check:
    environment:
      S3_URL: https://${S3_HOST:?}
      WEB_URL: https://${WAVEVIEW_HOST:?}
      ALLOWED_ORIGINS: https://${SITE_HOST:?}
      SITE_URL: https://${SITE_HOST:?}
    extra_hosts: !override
      - ${S3_HOST:?}:host-gateway
      - ${WAVEVIEW_HOST:?}:host-gateway

  judge-check:
    environment:
      SITE_URL: https://${SITE_HOST:?}
      SITE_HOST: ${SITE_HOST:?}
    extra_hosts:
      - ${SITE_HOST:?}:host-gateway

volumes:
  caddy-config:
