name: Staging

# A commit of master after a green CI (docs/deployment.md#деплой-из-ci): the images of the platform in
# GHCR, the deploy of the commit to staging with them, the end-to-end tests against staging.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time and in order: a newer commit waits for the running deploy.
concurrency:
  group: staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  SITE: https://staging.apparatica.app  # apparatica_site_host of deploy/ansible/inventories/staging

jobs:
  images:
    name: Images
    # CI of a push to master, or by hand from master: the environment takes no other branch.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: backend/Dockerfile }
          - { name: worker, dockerfile: worker/Dockerfile }
          - { name: web, dockerfile: web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag of the commit
        id: tag
        run: echo "tag=sha-${COMMIT::12}" >> "$GITHUB_OUTPUT"
      # The source label links the package to the repository.
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Secrets of the environment reach only master (its deployment branch rule).
    environment:
      name: staging
      url: ${{ env.SITE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      # The key of the user deploy; the host keys are those of the inventory.
      - name: Set up SSH to staging
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          grep -v '^#' deploy/ansible/inventories/staging/known_hosts > ~/.ssh/known_hosts
      - name: Deploy the commit with its images
        run: just deploy staging -e ansible_user=deploy -e apparatica_image_tag=sha-${COMMIT::12}

  e2e:
    name: End-to-end tests
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # specs/09 §4.4 against staging: the Chrome of the runner image, checks judged under gVisor.
      - name: End-to-end tests
        env:
          E2E_BASE_URL: ${{ env.SITE }}
          E2E_BROWSER: chrome
          # Staging sends no letters to Mailpit: the login with a link is left to the stand.
          E2E_MAILPIT_URL: ""
        run: |
          pnpm install --frozen-lockfile --filter @apparatica/e2e
          just e2e
      - name: Report of the end-to-end tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-staging-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
