# The host itself: packages, SSH by keys only, the firewall, security updates, the journal.
- name: Install the packages of the host
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, nftables, unattended-upgrades, apt-listchanges]
    update_cache: true
    cache_valid_time: 3600

- name: Create the directories of drop-in configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/systemd/system/nftables.service.d, /etc/systemd/journald.conf.d]

- name: Allow SSH by keys only
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-apparatica.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Write the firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the firewall

# The service flushes the whole ruleset on stop, the tables of Docker included: only ours.
- name: Stop the firewall without the rules of Docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/apparatica.conf
    mode: "0644"
    content: |
      [Service]
      ExecStop=
      ExecStop=/usr/sbin/nft delete table inet apparatica
  notify: Reload the firewall

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true

# Debian's own origins only (50unattended-upgrades): Docker and gVisor change with the playbooks;
# no reboots.
- name: Install the updates of Debian daily
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Limit the journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/apparatica.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ base_journal_max }}
  notify: Restart journald
