- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload the firewall
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
    daemon_reload: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
