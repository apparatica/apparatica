# Ansible of the servers (docs/deployment.md). Run through `just provision` and `just deploy`.
[defaults]
inventory = inventories/staging
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
result_format = yaml
retry_files_enabled = false
# A run that fails after a change still applies it: the reload of sshd, of the firewall.
force_handlers = true

[ssh_connection]
pipelining = true
