# Prometheus of the stand (`just monitoring`, docs/stand.md#мониторинг): the metrics of the API,
# the ingestor and the worker (docs/configuration.md#метрики). The ports are reachable only in the
# compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: ingest
    static_configs:
      - targets: ["ingest:9100"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
